arm_left_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - arm_left_1_joint
      - arm_left_2_joint
      - arm_left_3_joint
      - arm_left_4_joint
      - arm_left_5_joint
      - arm_left_6_joint
      - arm_left_7_joint
    command_interfaces:
      - position
    state_interfaces:
      - position

    gains:
      arm_left_1_joint:
        p: 0.0
        i: 0.0
        d: 0.0
      arm_left_2_joint:
        p: 0.0
        i: 0.0
        d: 0.0
      arm_left_3_joint:
        p: 0.0
        i: 0.0
        d: 0.0
      arm_left_4_joint:
        p: 0.0
        i: 0.0
        d: 0.0
      arm_left_5_joint:
        p: 0.0
        i: 0.0
        d: 0.0
      arm_left_6_joint:
        p: 0.0
        i: 0.0
        d: 0.0
      arm_left_7_joint:
        p: 0.0
        i: 0.0
        d: 0.0

    interpolate_from_desired_state: true

    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 5.0
      arm_left_1_joint:
        goal: 0.02
      arm_left_2_joint:
        goal: 0.02
      arm_left_3_joint:
        goal: 0.02
      arm_left_4_joint:
        goal: 0.02
      arm_left_5_joint:
        goal: 0.02
      arm_left_6_joint:
        goal: 0.02
      arm_left_7_joint:
        goal: 0.02
